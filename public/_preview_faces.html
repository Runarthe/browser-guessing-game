<!doctype html><html><head><meta charset="utf-8"><title>Confetti expression preview</title>
<style>body{background:#17152f;color:#fff;font:16px system-ui;margin:32px}h1{margin-bottom:4px}p{color:#c1bddb}.row{display:flex;gap:24px;margin:30px 0}.sample{text-align:center;width:108px}.disc{display:inline-grid;place-items:center;width:76px;height:76px;border:5px solid var(--color);border-radius:50%;background:#fff0ca;box-shadow:0 0 0 3px #191541}.face-badge{width:80%;height:80%}.small{width:32px;height:32px;border-width:3px}canvas{width:720px;height:160px}</style></head>
<body><h1>Confetti expressions</h1><p>Capsule-inspired smiles · the same artwork in menus and games</p>
<div id="large" class="row"></div><div id="small" class="row"></div><canvas id="canvas" width="1440" height="320"></canvas>
<script src="characters.js"></script><script>
const faces=['joy','wink','wow','cool','heart','dizzy'],colors=['#ff6b6b','#ffcb3d','#4ade80','#60a5fa','#f472b6','#a78bfa'];
for(const [i,face]of faces.entries())for(const id of ['large','small'])document.getElementById(id).insertAdjacentHTML('beforeend',`<div class="sample"><span class="disc ${id==='small'?'small':''}" style="--color:${colors[i]}">${PaperCharacter.faceSvg(face)}</span><p>${id==='large'?face:'32 px'}</p></div>`);
const ctx=document.getElementById('canvas').getContext('2d');ctx.scale(2,2);
faces.forEach((face,i)=>PaperCharacter.draw(ctx,{x:54+i*120,y:82,size:76,avatar:{emoji:'face-'+face,color:colors[i]},time:0}));
</script></body></html>
